name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]  # PR 등록 + 새 커밋 push 시 트리거

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            아래 검수 지침에 따라 이 PR을 리뷰해줘.

            [검수 지침]
            1. 거시적인 관점에서 발생할 수 있는 문제 위주로 리뷰한다.
               (아키텍처, 설계, 잠재적 버그, 성능/안정성에 영향을 줄 수 있는 큰 이슈 중심)
            2. 너무 깊게 파고들어 미시적인 수준(변수명, 코드 스타일, 사소한 포맷팅 등)의
               리뷰는 하지 않는다.
            3. 이 PR에 이전 리뷰 코멘트가 이미 달려 있다면, 이번 diff(새 커밋)에서
               해당 사항들이 반영되었는지 먼저 확인한다.
               - 검토 시작 시 gh api graphql로 unresolved reviewThreads의 thread id,
                 코멘트, 파일/라인 및 outdated 상태를 조회한다.
               - 반영된 사항: 실제 코드와 테스트로 해결을 확인한 뒤 해당 review thread를
                 resolveReviewThread GraphQL mutation으로 Resolve conversation 처리한다.
                 단순히 outdated 상태라는 이유만으로 resolve하지 않는다.
               - 반영되지 않은 사항: 다시 언급
               - 새로 발견된 문제: 새 리뷰로 등록
               - 이번 실행에서 새로 만든 스레드나 해결 여부가 불명확한 스레드는
                 절대 resolve하지 않는다.
               - 기존 지적 사항이 모두 반영되었고 새로운 문제가 없다면, 리뷰를 종료한다는
                 취지로 짧게 정리한다.
            4. 구체적인 파일과 라인에 대한 지적은
               mcp__github_inline_comment__create_inline_comment 도구로 남긴다.
               실제 지적만 confirmed: true 로 등록한다.
            5. 검토가 끝나면 일반 PR 코멘트(gh pr comment)를 사용하지 말고,
               현재 HEAD SHA에 대해 정확히 하나의 Submit review를 등록한다.
               - 머지를 막아야 하는 문제가 있으면:
                 gh pr review ${{ github.event.pull_request.number }} --request-changes
               - 개선 의견만 있고 머지를 막을 필요가 없으면, 인라인 의견은 유지하되:
                 gh pr review ${{ github.event.pull_request.number }} --approve
               - 지적할 문제가 없으면:
                 gh pr review ${{ github.event.pull_request.number }} --approve
               각 명령에는 검토 결과와 resolve한 기존 스레드 수를 요약한 review body를
               반드시 포함한다.

            최종 결과는 반드시 GitHub의 정식 Submit review 상태로 남겨라.
          claude_args: |
            --max-turns 50
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(gh pr:*),Bash(gh api:*)"
